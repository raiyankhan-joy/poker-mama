<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>POKER MAMA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #060b14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box {
      padding: 28px 24px;
      max-width: 320px;
    }
    .spade {
      font-size: 3rem;
      color: #f5c542;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      letter-spacing: 3px;
      color: #fde68a;
      font-size: 1.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin: 0 0 18px;
      line-height: 1.45;
    }
    button {
      background: linear-gradient(135deg, #f5c542, #d99b18);
      color: #1a1203;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spade">♠</div>
    <h1>POKER MAMA</h1>
    <p>Connecting to live poker tables... Please make sure your internet connection is active.</p>
    <button onclick="window.location.href='https://pooker-online.onrender.com'">Reconnect</button>
  </div>
</body>
</html>

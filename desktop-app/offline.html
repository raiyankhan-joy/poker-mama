<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POKER MAMA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #060b14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box {
      padding: 32px 28px;
      max-width: 360px;
    }
    .spade {
      font-size: 3.4rem;
      color: #f5c542;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 10px;
      letter-spacing: 4px;
      color: #fde68a;
      font-size: 1.7rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.94rem;
      margin: 0 0 22px;
      line-height: 1.5;
    }
    button {
      background: linear-gradient(135deg, #f5c542, #d99b18);
      color: #1a1203;
      border: none;
      padding: 11px 26px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.94rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spade">♠</div>
    <h1>POKER MAMA</h1>
    <p>Unable to reach the live poker server. Please check your internet connection and try again.</p>
    <button onclick="window.location.href='https://pooker-online.onrender.com'">Reconnect</button>
  </div>
</body>
</html>

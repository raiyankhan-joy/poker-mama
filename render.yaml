services:
  - type: web
    name: pooker-online
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: METERED_APP_NAME
        sync: false
      - key: METERED_API_KEY
        sync: false
